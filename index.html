<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Paper Route</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #E9E3D2;
        --blue: #1F3A93;
        --pink: #FF4FA3;
        --yellow: #FFC53D;
        --deep: #12162B;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        background: var(--paper);
        font-family: 'DM Mono', ui-monospace, monospace;
        color: var(--deep);
      }

      #game {
        display: block;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      #hud-alt, #hud-speed, #hud-bearing, #hud-stall, #hud-fail {
        position: absolute;
        font-family: 'Archivo', system-ui, sans-serif;
        font-weight: 700;
      }

      #click-to-fly {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 18px;
        font-family: 'DM Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 14px;
        letter-spacing: 0.15em;
        color: var(--deep);
        background: rgba(233, 227, 210, 0.85);
        border: 1px solid var(--deep);
        border-radius: 2px;
        pointer-events: none;
        z-index: 20;
        user-select: none;
      }

      #click-to-fly[hidden] { display: none; }

      /* Positional anchors for each HUD region. */
      #hud-alt {
        left: 32px;
        bottom: 32px;
        text-align: left;
      }

      #hud-speed {
        right: 32px;
        bottom: 32px;
        text-align: right;
      }

      #hud-bearing {
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
      }

      #hud-fail {
        top: 58%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: 'DM Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.12em;
        color: var(--deep);
        background: var(--paper);
        padding: 14px 24px;
        box-shadow: 0 2px 0 var(--deep);
        display: none;
      }

      /* Big misregistered numerals (alt / speed / distance).
         Double-print: the first glyph takes layout space; the second is
         absolutely stacked on top. Both use mix-blend-mode: multiply so
         the offset blue+pink prints read as a risograph misregistration. */
      .hud-numeral {
        position: relative;
        display: inline-block;
        font-family: 'Archivo', system-ui, sans-serif;
        font-weight: 700;
        font-size: 104px;
        line-height: 1;
        transform: scaleX(1.25);
        background: var(--paper);
        padding: 8px 16px 4px;
        box-shadow: 0 2px 0 var(--deep);
        /* Contain mix-blend-mode: multiply on the glyph spans so blue+pink
           blend against this paper backdrop, not against the WebGL canvas. */
        isolation: isolate;
      }

      #hud-alt .hud-numeral { transform-origin: left bottom; }
      #hud-speed .hud-numeral { transform-origin: right bottom; }
      #hud-bearing .hud-numeral { transform-origin: center top; font-size: 84px; }

      .hud-glyph {
        display: inline-block;
        mix-blend-mode: multiply;
      }

      .hud-glyph--blue {
        color: var(--blue);
        transform: translate(1px, 1px);
      }

      .hud-glyph--pink {
        position: absolute;
        top: 8px;
        left: 16px;
        right: 16px;
        color: var(--pink);
        transform: translate(-1px, -1px);
      }

      #hud-speed .hud-glyph--pink { text-align: right; }
      #hud-bearing .hud-glyph--pink { text-align: center; }

      /* Labels — DM Mono, wide tracking, single-print. */
      .hud-label {
        font-family: 'DM Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 15px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--deep);
        margin-top: 6px;
      }

      #hud-bearing .hud-label { margin-top: 0; margin-bottom: 6px; }

      /* Bearing bar + sliding tick (single-print, no misregistration). */
      .hud-bearing-bar {
        position: relative;
        width: 280px;
        height: 2px;
        margin: 10px auto 0;
        background: var(--deep);
      }

      .hud-bearing-tick {
        position: absolute;
        top: -6px;
        left: 50%;
        width: 0;
        height: 0;
        margin-left: -6px;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 10px solid var(--deep);
        transition: left 60ms linear;
      }

      /* Per-level best chip — DM Mono, single-print, --deep ink.
         Sits beneath the top-center Dist chip. No misregistration: the
         blue+pink multiply effect is reserved for the big Archivo numerals. */
      #hud-best {
        position: absolute;
        top: 200px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'DM Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 12px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--deep);
        text-align: center;
        white-space: nowrap;
      }

      /* STALL — the only place --yellow is ever used. Single-print, crisp.
         Sits on a --paper chip with a hard 2px ink drop so yellow doesn't
         vibrate against deep-blue fog. No misregistration on this element. */
      #hud-stall {
        top: 42%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 128px;
        line-height: 1;
        letter-spacing: 0.08em;
        color: var(--yellow);
        background: var(--paper);
        padding: 16px 32px 12px;
        box-shadow: 0 2px 0 var(--deep);
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="hud-alt">
        <div class="hud-numeral">
          <span class="hud-glyph hud-glyph--blue">0</span>
          <span class="hud-glyph hud-glyph--pink">0</span>
        </div>
        <div class="hud-label">Alt</div>
      </div>
      <div id="hud-speed">
        <div class="hud-numeral">
          <span class="hud-glyph hud-glyph--blue">0</span>
          <span class="hud-glyph hud-glyph--pink">0</span>
        </div>
        <div class="hud-label">Spd</div>
      </div>
      <div id="hud-bearing">
        <div class="hud-label">Dist</div>
        <div class="hud-numeral">
          <span class="hud-glyph hud-glyph--blue">0</span>
          <span class="hud-glyph hud-glyph--pink">0</span>
        </div>
        <div class="hud-bearing-bar">
          <div class="hud-bearing-tick"></div>
        </div>
      </div>
      <div id="hud-best">BEST — · —</div>
      <div id="hud-stall">STALL</div>
      <div id="hud-fail"></div>
    </div>
    <div id="click-to-fly" hidden>CLICK TO FLY</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
