<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Paper Route</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #E9E3D2;
        --blue: #1F3A93;
        --pink: #FF4FA3;
        --yellow: #FFC53D;
        --deep: #12162B;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        background: var(--paper);
        font-family: 'DM Mono', ui-monospace, monospace;
        color: var(--deep);
      }

      #game {
        display: block;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      #hud-alt, #hud-speed, #hud-bearing, #hud-stall, #hud-fail {
        position: absolute;
        font-family: 'Archivo', system-ui, sans-serif;
        font-weight: 700;
      }

      #click-to-fly {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 18px;
        font-family: 'DM Mono', ui-monospace, monospace;
        font-weight: 500;
        font-size: 14px;
        letter-spacing: 0.15em;
        color: var(--deep);
        background: rgba(233, 227, 210, 0.85);
        border: 1px solid var(--deep);
        border-radius: 2px;
        pointer-events: none;
        z-index: 20;
        user-select: none;
      }

      #click-to-fly[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="hud-alt"></div>
      <div id="hud-speed"></div>
      <div id="hud-bearing"></div>
      <div id="hud-stall"></div>
      <div id="hud-fail"></div>
    </div>
    <div id="click-to-fly" hidden>CLICK TO FLY</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
